<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>RSVP Reader</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/styles.css?v=5">
</head>
<body>
    <!-- Экран библиотеки -->
    <div id="library-screen" class="screen active">
        <header class="header">
            <h1>RSVP Reader</h1>
            <div class="header-actions">
                <!-- Sign In Button -->
                <button id="sign-in-btn" class="icon-btn sign-in-btn" aria-label="Sign In">
                    <svg viewBox="0 0 24 24" width="24" height="24">
                        <path fill="currentColor" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                </button>
                <!-- User Info (shown when logged in) -->
                <div id="user-info" class="user-info" style="display:none">
                    <img id="user-avatar" class="user-avatar" src="" alt="">
                    <span id="user-name" class="user-name"></span>
                </div>
                <button id="settings-btn" class="icon-btn" aria-label="Настройки">
                    <svg viewBox="0 0 24 24" width="24" height="24">
                        <path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                    </svg>
                </button>
            </div>
        </header>

        <main class="library-content">
            <div id="book-list" class="book-list">
                <!-- Книги будут добавлены динамически -->
            </div>

            <div id="empty-library" class="empty-state">
                <p>Библиотека пуста</p>
                <p class="hint">Нажмите + чтобы добавить книгу</p>
            </div>
        </main>

        <input type="file" id="file-input" accept=".epub" hidden>
        <button id="add-book-btn" class="fab" aria-label="Добавить книгу">
            <svg viewBox="0 0 24 24" width="32" height="32">
                <path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
            </svg>
        </button>
    </div>

    <!-- Экран ридера -->
    <div id="reader-screen" class="screen">
        <header class="reader-header">
            <button id="back-btn" class="icon-btn" aria-label="Назад">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
            </button>
            <span id="book-title" class="book-title">Название книги</span>
            <button id="toc-btn" class="icon-btn" aria-label="Оглавление">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/>
                </svg>
            </button>
            <button id="bookmark-btn" class="icon-btn" aria-label="Закладка">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/>
                </svg>
            </button>
            <button id="search-btn" class="icon-btn" aria-label="Поиск">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
            </button>
            <button id="mode-toggle-btn" class="icon-btn" aria-label="Переключить режим">
                <svg id="mode-icon-rsvp" viewBox="0 0 24 24" width="24" height="24" style="display:none">
                    <path fill="currentColor" d="M4 6h16v2H4zm4 5h12v2H8zm6 5h6v2h-6z"/>
                </svg>
                <svg id="mode-icon-book" viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M21 3h-6c-1.1 0-2.1.45-2.8 1.17L12 4.37l-.2-.2C11.1 3.45 10.1 3 9 3H3v18h6c1.1 0 2.1.45 2.8 1.17l.2.2.2-.2c.7-.72 1.7-1.17 2.8-1.17h6V3zm-2 15h-4c-.55 0-1.05.22-1.41.59L12 20.17l-1.59-1.59C10.05 18.22 9.55 18 9 18H5V5h4c.55 0 1.05.22 1.41.59L12 7.17l1.59-1.59C13.95 5.22 14.45 5 15 5h4v13z"/>
                </svg>
            </button>
            <button id="reader-settings-btn" class="icon-btn" aria-label="Настройки">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                </svg>
            </button>
        </header>

        <main class="reader-content" id="rsvp-content" style="display:none">
            <div id="word-display" class="word-display">
                <span class="word-left"></span><span class="word-focus"></span><span class="word-right"></span>
            </div>
            <div class="focus-line"></div>
        </main>

        <main id="normal-reader-content" class="normal-reader-content">
            <div id="normal-reader-container" class="normal-reader-container">
                <div id="normal-reader-pages" class="normal-reader-pages"></div>
            </div>
            <div id="page-indicator" class="page-indicator">1 / 1</div>
            <button id="start-rsvp-btn" class="floating-rsvp-btn" style="display:none">RSVP &#9654;</button>
        </main>

        <footer id="rsvp-controls" class="reader-controls" style="display:none">
            <div class="progress-container">
                <div id="progress-bar" class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
                <span id="progress-text" class="progress-text">0%</span>
            </div>

            <div class="control-row main-controls">
                <button id="rewind-btn" class="control-btn" aria-label="Назад">
                    <svg viewBox="0 0 24 24" width="28" height="28">
                        <path fill="currentColor" d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/>
                    </svg>
                </button>
                <button id="play-btn" class="control-btn play-btn" aria-label="Старт">
                    <svg class="play-icon" viewBox="0 0 24 24" width="40" height="40">
                        <path fill="currentColor" d="M8 5v14l11-7z"/>
                    </svg>
                    <svg class="pause-icon" viewBox="0 0 24 24" width="40" height="40" style="display:none">
                        <path fill="currentColor" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                    </svg>
                </button>
                <button id="forward-btn" class="control-btn" aria-label="Вперёд">
                    <svg viewBox="0 0 24 24" width="28" height="28">
                        <path fill="currentColor" d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/>
                    </svg>
                </button>
            </div>

            <div class="control-row speed-controls">
                <button id="slower-btn" class="control-btn small" aria-label="Медленнее">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path fill="currentColor" d="M19 13H5v-2h14v2z"/>
                    </svg>
                </button>
                <span id="speed-display" class="speed-display">250 WPM</span>
                <button id="faster-btn" class="control-btn small" aria-label="Быстрее">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                    </svg>
                </button>
            </div>
        </footer>
    </div>

    <!-- Модалка оглавления -->
    <div id="toc-modal" class="modal">
        <div class="modal-content toc-modal-content">
            <h2>Оглавление</h2>
            <div id="toc-list" class="toc-list">
                <!-- Главы будут добавлены динамически -->
            </div>
            <button id="close-toc-btn" class="btn">Закрыть</button>
        </div>
    </div>

    <!-- Модалка закладок -->
    <div id="bookmarks-modal" class="modal">
        <div class="modal-content toc-modal-content">
            <h2>Закладки</h2>
            <div id="bookmarks-list" class="toc-list"></div>
            <button id="close-bookmarks-btn" class="btn">Закрыть</button>
        </div>
    </div>

    <!-- Модалка поиска -->
    <div id="search-modal" class="modal">
        <div class="modal-content toc-modal-content">
            <h2>Поиск</h2>
            <input type="text" id="search-input" class="search-input" placeholder="Поиск по книге...">
            <div id="search-results" class="toc-list"></div>
            <button id="close-search-btn" class="btn">Закрыть</button>
        </div>
    </div>

    <!-- Модалка настроек -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <h2>Настройки</h2>

            <h3 class="settings-section-title">Обычный режим</h3>

            <div class="setting-item">
                <label for="normal-font-size-slider">Размер шрифта</label>
                <input type="range" id="normal-font-size-slider" min="14" max="32" value="18">
                <span id="normal-font-size-value">18px</span>
            </div>

            <div class="setting-item">
                <label>Шрифт</label>
                <div class="font-toggle">
                    <button id="font-sans-btn" class="font-toggle-btn active">Sans-serif</button>
                    <button id="font-serif-btn" class="font-toggle-btn">Serif</button>
                </div>
            </div>

            <h3 class="settings-section-title">RSVP режим</h3>

            <div class="setting-item">
                <label for="font-size-slider">Размер шрифта</label>
                <input type="range" id="font-size-slider" min="24" max="72" value="48">
                <span id="font-size-value">48px</span>
            </div>

            <div class="setting-item">
                <label for="default-speed-slider">Скорость по умолчанию</label>
                <input type="range" id="default-speed-slider" min="10" max="800" step="10" value="250">
                <span id="default-speed-value">250 WPM</span>
            </div>

            <div class="setting-item">
                <label for="long-word-threshold-slider">Порог длинного слова</label>
                <input type="range" id="long-word-threshold-slider" min="4" max="15" value="8">
                <span id="long-word-threshold-value">8 букв</span>
            </div>

            <div class="setting-item">
                <label for="long-word-extra-slider">Доп. время для длинных слов</label>
                <input type="range" id="long-word-extra-slider" min="0" max="100" step="5" value="30">
                <span id="long-word-extra-value">+30%</span>
            </div>

            <div id="sync-section" class="setting-item sync-section" style="display:none">
                <label>Синхронизация</label>
                <button id="sync-now-btn" class="btn btn-secondary">Синхронизировать</button>
                <button id="sign-out-btn" class="btn btn-danger">Выйти</button>
            </div>

            <button id="close-settings-btn" class="btn">Закрыть</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
    <!-- App Scripts -->
    <script src="js/firebase-config.js?v=5"></script>
    <script src="js/storage.js?v=5"></script>
    <script src="js/firebase-sync.js?v=5"></script>
    <script src="js/epub-parser.js?v=5"></script>
    <script src="js/library.js?v=5"></script>
    <script src="js/reader.js?v=5"></script>
    <script src="js/normal-reader.js?v=5"></script>
    <script src="js/search.js?v=5"></script>
    <script src="js/app.js?v=5"></script>
</body>
</html>
